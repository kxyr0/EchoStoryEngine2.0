plugins {
    id 'net.minecraftforge.gradle'
    id 'maven-publish'
}

description = 'Forge 1.20.1 platform adapter for Echo Story Engine.'

def embeddedStoryProjects = [project(':story-contracts'), project(':story-core')]

base {
    archivesName = artifact_name
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    embeddedStoryProjects.each { storyProject ->
                        source storyProject.sourceSets.main
                    }
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':story-core')
    implementation project(':story-contracts')

    testImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedStoryProjects.collect { "${it.path}:classes" }
    embeddedStoryProjects.each { storyProject ->
        from(storyProject.sourceSets.main.output)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : api_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('forgeJarContainsRuntimeClasses') {
    group = 'verification'
    description = 'Checks that the distributable Forge jar contains Java-only runtime modules.'
    dependsOn tasks.named('jar')

    doLast {
        def requiredEntries = [
                'io/github/kxyr0/echostoryengine/story/api/StoryEngineApi.class',
                'io/github/kxyr0/echostoryengine/story/core/port/DiagnosticSink.class'
        ]
        def missing = []
        new java.util.jar.JarFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { jarFile ->
            requiredEntries.each { entry ->
                if (jarFile.getEntry(entry) == null) {
                    missing << entry
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Forge jar is missing runtime classes:\n" + missing.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('forgeJarContainsRuntimeClasses')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
