side="BOTH"

[[dependencies.${project.mod_id}]]
modId="echo_story_engine"
mandatory=true
versionRange="[1.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${project.mod_id}]]
modId="echo_dialogue"
mandatory=true
