plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Forge 1.20.1 authoritative runtime host for Echo Time.'
def embeddedTimeProjects = [
        project(':time-contracts'),
        project(':time-core'),
        project(':time-forge-api-1.20.1'),
        project(':time-script-adapter-1.20.1')
]

base { archivesName = artifact_name }
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    embeddedTimeProjects.each { timeProject -> source timeProject.sourceSets.main }
                }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':time-contracts')
    implementation project(':time-core')
    implementation project(':time-forge-api-1.20.1')
    implementation project(':time-script-adapter-1.20.1')
    implementation "io.github.kxyr0.echoscript:echo-script-api:${echo_script_version}"
    implementation "io.github.kxyr0.echoscript:echo-script-language:${echo_script_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var values = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                  loader_version_range: loader_version_range, mod_license: mod_license, mod_version: mod_version,
                  mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values + [project: project] }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedTimeProjects.collect { "${it.path}:classes" }
    embeddedTimeProjects.each { timeProject -> from(timeProject.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    dependsOn embeddedTimeProjects.collect { "${it.path}:classes" }
    embeddedTimeProjects.each { timeProject -> from(timeProject.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyProductionJarContents') {
    dependsOn tasks.named('reobfJarJar')
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${artifact_name}-${mod_version}-all.jar").get().asFile
        if (!jarFile.isFile() || jarFile.length() == 0L) throw new GradleException("Missing production JAR: ${jarFile}")
        def required = ['META-INF/mods.toml',
                        'io/github/kxyr0/echotime/api/value/EchoInstant.class',
                        'io/github/kxyr0/echotime/core/clock/EchoClock.class',
                        'io/github/kxyr0/echotime/forge/EchoTimeMod.class']
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def missing = required.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) throw new GradleException("Production JAR missing:\n" + missing.join('\n'))
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyProductionJarContents') }
