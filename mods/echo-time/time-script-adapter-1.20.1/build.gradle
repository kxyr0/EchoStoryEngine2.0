plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Story and Dialogue script integration for Echo Time.'

minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':time-contracts')
    implementation project(':time-core')
    implementation project(':time-forge-api-1.20.1')
    implementation "io.github.kxyr0.echostoryengine:story-contracts:${echo_story_engine_version}"
    implementation "io.github.kxyr0.echostoryengine:story-extension-api:${echo_story_engine_version}"
    implementation "io.github.kxyr0.echostoryengine:story-extension-forge-1.20.1:${echo_story_engine_version}"
    implementation "io.github.kxyr0.echodialogue:dialogue-contracts:${echo_dialogue_version}"
    implementation "io.github.kxyr0.echodialogue:dialogue-forge-api-1.20.1:${echo_dialogue_version}"
}
