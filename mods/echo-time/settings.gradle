pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-time'

include 'time-contracts'
include 'time-core'
include 'time-forge-api-1.20.1'
include 'time-forge-1.20.1'
include 'time-script-adapter-1.20.1'
include 'time-testmod-1.20.1'

includeBuild '../echo-script'
includeBuild '../echo-story-engine'
includeBuild '../echo-dialogue'
