plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
}
allprojects {
    group = 'io.github.kxyr0.echoteleportmagic'
    version = '0.1.0'
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' } }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
apply from: 'gradle/source-shape.gradle'
tasks.named('check') { dependsOn 'sourceShapeCheck', subprojects.collect { "${it.path}:check" } }
tasks.named('assemble') { dependsOn subprojects.collect { "${it.path}:assemble" } }
tasks.register('test') { dependsOn subprojects.collect { "${it.path}:test" } }
