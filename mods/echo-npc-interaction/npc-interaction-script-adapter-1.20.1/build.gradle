plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Generic EchoScript host adapter for Echo NPC Interaction.'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':npc-interaction-contracts')
    implementation project(':npc-interaction-core')
    implementation project(':npc-interaction-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echonpc:npc-contracts:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-contracts:${story_api_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-api:${story_api_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-forge-1.20.1:${story_api_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-contracts:${dialogue_api_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-forge-api-1.20.1:${dialogue_api_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-contracts:${trigger_api_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-forge-api-1.20.1:${trigger_api_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: 'echo_npc_interaction_script_adapter',
            mod_name: 'Echo NPC Interaction Script Adapter',
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: 'Generic EchoScript adapter for Echo NPC Interaction.',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
