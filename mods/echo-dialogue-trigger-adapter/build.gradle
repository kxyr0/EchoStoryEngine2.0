plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
}

version = mod_version
group = mod_group_id

def dialogueRoot = providers.gradleProperty('dialogueRoot')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir('../echo-dialogue').asFile)
def triggerRoot = providers.gradleProperty('triggerRoot')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir('../echo-trigger').asFile)
def dialogueIntegrationMaven = providers.gradleProperty('dialogueIntegrationMaven')
        .map { file(it) }
        .orElse(dialogueRoot.map { new File(it, 'build/integration-maven') })
def triggerIntegrationMaven = providers.gradleProperty('triggerIntegrationMaven')
        .map { file(it) }
        .orElse(triggerRoot.map { new File(it, 'build/integration-maven') })

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'DialogueIntegration'
        url = dialogueIntegrationMaven.get()
    }
    maven {
        name = 'TriggerIntegration'
        url = triggerIntegrationMaven.get()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    architectureTest {
        java.srcDir 'src/architectureTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

base {
    archivesName = artifact_name
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { }
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-contracts:${dialogue_api_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-forge-api-1.20.1:${dialogue_api_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-contracts:${trigger_api_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-forge-api-1.20.1:${trigger_api_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.github.kxyr0.echodialogue:dialogue-contracts:${dialogue_api_version}"
    testImplementation "io.github.kxyr0.echotrigger:trigger-contracts:${trigger_api_version}"
    testImplementation "io.github.kxyr0.echotrigger:trigger-forge-api-1.20.1:${trigger_api_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    architectureTestImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
    architectureTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = checkstyle_version
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = pmd_version
    ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
    ruleSets = []
    consoleOutput = true
}

tasks.register('architectureTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath = sourceSets.architectureTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.register('publishDialoguePublicArtifacts', Exec) {
    workingDir dialogueRoot.get()
    commandLine gradleWrapper(dialogueRoot.get()), 'publishDialogueIntegrationArtifacts', '--console=plain'
}

tasks.register('publishTriggerPublicArtifacts', Exec) {
    workingDir triggerRoot.get()
    commandLine gradleWrapper(triggerRoot.get()), 'publishTriggerIntegrationArtifacts', '--console=plain'
}

tasks.register('validatePublicArtifacts') {
    dependsOn tasks.named('publishDialoguePublicArtifacts')
    dependsOn tasks.named('publishTriggerPublicArtifacts')
    doLast {
        def missing = []
        ['dialogue-contracts', 'dialogue-forge-api-1.20.1'].each { artifact ->
            def directory = new File(dialogueIntegrationMaven.get(),
                    "io/github/kxyr0/echodialogue/${artifact}/${dialogue_api_version}")
            if (!directory.isDirectory()) {
                missing.add(directory)
            }
        }
        ['trigger-contracts', 'trigger-forge-api-1.20.1'].each { artifact ->
            def directory = new File(triggerIntegrationMaven.get(),
                    "io/github/kxyr0/echotrigger/${artifact}/${trigger_api_version}")
            if (!directory.isDirectory()) {
                missing.add(directory)
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing public artifacts:\n" + missing.join('\n'))
        }
    }
}

['compileJava', 'compileTestJava', 'compileArchitectureTestJava'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn tasks.named('validatePublicArtifacts')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            dialogue_mod_version_range: dialogue_mod_version_range,
            trigger_mod_version_range: trigger_mod_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes('Automatic-Module-Name': mod_id)
    }
    finalizedBy 'reobfJar'
}

tasks.register('sourceShapeCheck') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    doLast {
        def violations = []
        def counts = [:].withDefault { 0 }
        fileTree(rootDir) {
            include 'src/main/java/**/*.java'
            exclude '**/build/**'
        }.files.each { file ->
            def text = file.getText('UTF-8')
            def relative = rootDir.toPath().relativize(file.toPath()).toString()
            counts[file.parentFile.toPath()] = counts[file.parentFile.toPath()] + 1
            if ((text =~ /(?m)^import\s+.*\.\*;/).find()) {
                violations << "${relative}: wildcard import"
            }
            if (relative =~ /(?i)(^|[\\\/])(common|misc|helpers?|utils?|manager|processor|handler|impl)([\\\/]|$)/) {
                violations << "${relative}: forbidden vague directory segment"
            }
            def logicalLines = text.readLines().count { line ->
                def trimmed = line.trim()
                trimmed && !trimmed.startsWith('//') && !trimmed.startsWith('*')
            }
            if (logicalLines > 200) {
                violations << "${relative}: ${logicalLines} logical lines; max is 200"
            }
        }
        counts.each { path, count ->
            if (count > 7) {
                violations << "${rootDir.toPath().relativize(path)}: ${count} production files; max is 7"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Source shape violations:\n" + violations.join('\n'))
        }
    }
}

tasks.register('checkWhitespace') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    doLast {
        def violations = []
        fileTree(rootDir) {
            include '*.gradle', 'gradle.properties', '.gitignore', '.gitattributes'
            include 'config/**/*.xml', 'src/**/*.java', 'src/**/*.toml', 'src/**/*.mcmeta'
            include 'README.md', 'PROGRESS.md', 'PLANS.md', 'docs/**/*.md'
            exclude '**/build/**', '**/.gradle/**', '**/run/**', '**/.git/**'
        }.files.each { file ->
            def text = file.getText('UTF-8')
            text.readLines().eachWithIndex { line, index ->
                if (line ==~ /.*[ \t]$/) {
                    violations << "${rootDir.toPath().relativize(file.toPath())}:${index + 1}: trailing whitespace"
                }
                if (line.contains('\t')) {
                    violations << "${rootDir.toPath().relativize(file.toPath())}:${index + 1}: tab"
                }
            }
            if (!text.isEmpty() && !text.endsWith('\n')) {
                violations << "${rootDir.toPath().relativize(file.toPath())}: missing final newline"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Whitespace violations:\n" + violations.join('\n'))
        }
    }
}

tasks.register('buildAdapterAgainstPublishedArtifacts') {
    group = LifecycleBasePlugin.BUILD_GROUP
    dependsOn tasks.named('validatePublicArtifacts')
    dependsOn tasks.named('build')
}

tasks.named('check') {
    dependsOn tasks.named('architectureTest')
    dependsOn tasks.named('sourceShapeCheck')
    dependsOn tasks.named('checkWhitespace')
}

String gradleWrapper(File root) {
    return new File(root, org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? 'gradlew.bat' : 'gradlew').absolutePath
}
