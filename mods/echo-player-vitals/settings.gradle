pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-player-vitals'

include 'player-vitals-contracts'
include 'player-vitals-core'
include 'player-vitals-forge-api-1.20.1'
include 'player-vitals-forge-1.20.1'
include 'player-vitals-testmod-1.20.1'
