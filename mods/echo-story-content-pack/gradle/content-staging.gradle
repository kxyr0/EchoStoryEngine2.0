tasks.register('verifyAcceptanceHarnessJar') {
    group = 'verification'
    description = 'Проверяет, что acceptance harness JAR существует и является отдельным JavaFML test-only модом.'
    dependsOn tasks.named('buildAcceptanceHarnessJar')
    doLast {
        File jar = new File(rootDir, "acceptance-harness/build/libs/${acceptance_harness_artifact_name}-${mod_version}.jar")
        if (!jar.isFile()) {
            throw new GradleException("verifyAcceptanceHarnessJar: JAR не найден: ${jar}")
        }
        ZipFile zip = new ZipFile(jar)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set
            [
                    'META-INF/mods.toml',
                    'pack.mcmeta',
                    'io/github/kxyr0/echostorycontentpack/acceptance/EchoStoryContentPackAcceptanceMod.class'
            ].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("verifyAcceptanceHarnessJar: missing ${required}")
                }
            }
            entries.each { entry ->
                if (entry.startsWith('data/') || entry.startsWith('assets/')) {
                    throw new GradleException("verifyAcceptanceHarnessJar: harness JAR must not own content resources: ${entry}")
                }
            }
        } finally {
            zip.close()
        }
        println "verifyAcceptanceHarnessJar: OK ${jar} (${jar.length()} bytes)"
    }
}

tasks.register('stageAcceptanceStoryPack') {
    group = 'verification'
    description = 'Собирает build/acceptance-story-pack из final runtime JARs, test-only content JAR и acceptance harness.'
    dependsOn tasks.named('stageStoryPack')
    dependsOn tasks.named('verifyAcceptanceContentJar')
    dependsOn tasks.named('verifyAcceptanceHarnessJar')
    doLast {
        File productionMods = layout.buildDirectory.dir('story-pack/mods').get().asFile
        File acceptanceJar = tasks.named('acceptanceContentJar').get().archiveFile.get().asFile
        File harnessJar = new File(rootDir, "acceptance-harness/build/libs/${acceptance_harness_artifact_name}-${mod_version}.jar")
        File output = layout.buildDirectory.dir('acceptance-story-pack').get().asFile
        File mods = new File(output, 'mods')
        delete output
        mods.mkdirs()
        productionMods.listFiles({ File file ->
            file.name.endsWith('.jar') && !file.name.startsWith("${artifact_name}-")
        } as FileFilter).each { runtimeJar ->
            copy {
                from runtimeJar
                into mods
            }
        }
        copy {
            from acceptanceJar
            into mods
        }
        copy {
            from harnessJar
            into mods
        }
        List<String> stagedNames = mods.listFiles({ File file -> file.name.endsWith('.jar') } as FileFilter)
                .collect { it.name }
                .sort()
        if (stagedNames.size() != 9) {
            throw new GradleException("stageAcceptanceStoryPack: ожидалось 9 staged JARs, найдено ${stagedNames.size()}.")
        }
        if (!stagedNames.contains(harnessJar.name)) {
            throw new GradleException("stageAcceptanceStoryPack: acceptance harness JAR не включён.")
        }
        new File(output, 'README.txt').text = """Echo Story Pack acceptance runtime

Этот набор предназначен только для runtime acceptance.
Он заменяет production content JAR на acceptance content JAR с ресурсами из src/acceptance/resources
и добавляет test-only JavaFML harness ${harnessJar.name}.
Не устанавливайте его в обычный игровой instance вместо production story pack.
""" + '\n'
        println "stageAcceptanceStoryPack: ${output.canonicalPath}"
        println 'stageAcceptanceStoryPack mods:'
        stagedNames.each { println " - ${it}" }
    }
}

def runtimeServerDir = { String name ->
    layout.buildDirectory.dir(name).get().asFile
}

def assertBuildRuntimeDir = { File runDir ->
    String buildPath = layout.buildDirectory.get().asFile.canonicalPath
    String runPath = runDir.canonicalPath
    if (!(runPath == buildPath || runPath.startsWith(buildPath + File.separator))) {
        throw new GradleException("Refusing to reset runtime dir outside buildDir: ${runPath}")
    }
}

def installForgeServer = { File runDir ->
    runDir.mkdirs()
    String argsName = Os.isFamily(Os.FAMILY_WINDOWS) ? 'win_args.txt' : 'unix_args.txt'
    File argsFile = new File(runDir, "libraries/net/minecraftforge/forge/${minecraft_version}-${forge_version}/${argsName}")
    if (argsFile.isFile()) {
        return argsFile
    }
    File installer = configurations.forgeServerInstaller.singleFile
    exec {
        workingDir runDir
        commandLine 'java', '-jar', installer.absolutePath, '--installServer', runDir.absolutePath
    }
    if (!argsFile.isFile()) {
        throw new GradleException("Forge server install did not create ${argsFile}")
    }
    return argsFile
}

def prepareServerRunDir = { File runDir, File stagedMods, boolean includeHarness ->
    assertBuildRuntimeDir(runDir)
    installForgeServer(runDir)
    ['mods', 'logs', 'world', 'config', 'defaultconfigs', 'story'].each { child ->
        delete new File(runDir, child)
    }
    ['banned-ips.json', 'banned-players.json', 'ops.json', 'usercache.json', 'whitelist.json'].each { child ->
        delete new File(runDir, child)
    }
    File mods = new File(runDir, 'mods')
    mods.mkdirs()
    copy {
        from stagedMods
        into mods
        if (!includeHarness) {
            exclude '*acceptance-harness*.jar'
        }
    }
    new File(runDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
    new File(runDir, 'server.properties').setText(
            'online-mode=false\nlevel-name=world\nmotd=Echo acceptance\nserver-port=0\nenable-query=false\n'
                    + 'enable-rcon=false\n',
            'UTF-8')
}

def verifyLogContains = { File logFile, String taskName, List<String> markers ->
    if (!logFile.isFile()) {
        throw new GradleException("${taskName}: log file not found: ${logFile}")
    }
    String log = logFile.getText('UTF-8')
    markers.each { marker ->
        if (!log.contains(marker)) {
            throw new GradleException("${taskName}: log marker not found: ${marker}")
        }
    }
    if (log.contains('ESCPC-ACCEPTANCE FAIL') || log.contains('ESCPC-ACCEPTANCE AUTO_FAIL') ||
            log.contains('PRODUCTION_SMOKE_FAIL')) {
        throw new GradleException("${taskName}: acceptance log contains FAIL marker.")
    }
}

def verifyLogClean = { File logFile, String taskName ->
    String log = logFile.getText('UTF-8')
    ['ERROR', 'FATAL', 'NoClassDefFoundError', 'ClassNotFoundException', 'NoSuchMethodError',
     'Failed to start', 'encountered an error'].each { marker ->
        if (log.contains(marker)) {
            throw new GradleException("${taskName}: forbidden log marker found: ${marker}")
        }
    }
}

def copyRuntimeLog = { File runDir, String reportName ->
    File logFile = new File(runDir, 'logs/latest.log')
    File reportDir = layout.buildDirectory.dir('reports/runtime').get().asFile
    reportDir.mkdirs()
    File reportFile = new File(reportDir, reportName)
    reportFile.setText(logFile.getText('UTF-8'), 'UTF-8')
    return reportFile
}

def verifyProductionModSet = { File runDir ->
    List<String> names = new File(runDir, 'mods').listFiles({ File file -> file.name.endsWith('.jar') } as FileFilter)
            .collect { it.name }
            .sort()
    List<String> expected = [
            "echo-animation-${echo_animation_version}-all.jar",
            "echo-dialogue-${echo_dialogue_version}-all.jar",
            "echo-npc-${echo_npc_version}-all.jar",
            "echo-npc-animation-adapter-${echo_npc_animation_adapter_version}.jar",
            "${artifact_name}-${mod_version}.jar",
            "echo-story-animation-adapter-${echo_story_animation_adapter_version}.jar",
            "echo-story-dialogue-adapter-${echo_story_dialogue_adapter_version}.jar",
            "echo-story-engine-${echo_story_engine_artifact_version}-all.jar",
            "echo-story-npc-adapter-${echo_story_npc_adapter_version}.jar"
    ].sort()
    if (names != expected) {
        throw new GradleException("Production runtime mods mismatch. Expected ${expected}, got ${names}")
    }
    names.each { name ->
        String lower = name.toLowerCase(Locale.ROOT)
        if (lower.contains('authoring') || lower.contains('acceptance') || lower.contains('gametest')) {
            throw new GradleException("Forbidden production runtime mod: ${name}")
        }
    }
}

def runForgeServer = { File runDir, String taskName, List<String> jvmArgs, List<String> commands,
                       boolean stopAfterCommands, List<String> stopOnMarkers ->
    File argsFile = installForgeServer(runDir)
    List<String> command = (['java'] + jvmArgs + ['@user_jvm_args.txt', "@${argsFile.absolutePath}", '--nogui'])
            .collect { it.toString() }
    Process process = new ProcessBuilder(command)
            .directory(runDir)
            .redirectErrorStream(true)
            .start()
    StringBuilder output = new StringBuilder()
    AtomicBoolean commandBlockSent = new AtomicBoolean(false)
    AtomicBoolean doneSeen = new AtomicBoolean(false)
    AtomicBoolean markerStopSent = new AtomicBoolean(false)
    Thread reader = new Thread({
        process.inputStream.withReader('UTF-8') { reader ->
            String line = reader.readLine()
            while (line != null) {
                println line
                output.append(line).append(System.lineSeparator())
                if (line.contains('Done (')) {
                    doneSeen.set(true)
                    if (commandBlockSent.compareAndSet(false, true)) {
                        commands.each { commandText ->
                            process.outputStream.write((commandText + System.lineSeparator()).getBytes('UTF-8'))
                            process.outputStream.flush()
                            Thread.sleep(300)
                        }
                        if (stopAfterCommands) {
                            Thread.sleep(1000)
                            process.outputStream.write(('stop' + System.lineSeparator()).getBytes('UTF-8'))
                            process.outputStream.flush()
                        }
                    }
                }
                if (stopOnMarkers.any { marker -> line.contains(marker) }
                        && markerStopSent.compareAndSet(false, true)) {
                    try {
                        process.outputStream.write(('stop' + System.lineSeparator()).getBytes('UTF-8'))
                        process.outputStream.flush()
                    } catch (IOException ignored) {
                        // The harness may already be stopping the server.
                    }
                }
                line = reader.readLine()
            }
        }
    } as Runnable, "${taskName}-stdout")
    reader.start()
    if (!process.waitFor(180, TimeUnit.SECONDS)) {
        process.destroyForcibly()
        throw new GradleException("${taskName}: Forge server did not exit before timeout.\n${output}")
    }
    reader.join(5000)
    if (process.exitValue() != 0) {
        throw new GradleException("${taskName}: Forge server exited with ${process.exitValue()}.\n${output}")
    }
    if (!doneSeen.get()) {
        throw new GradleException("${taskName}: Forge server never reached Done.\n${output}")
    }
}

