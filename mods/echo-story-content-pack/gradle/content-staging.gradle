def rel = { File file ->
    rootDir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
}

def siblingDir = { String propertyName ->
    File configured = file(project.findProperty(propertyName) ?: '')
    configured.isAbsolute() ? configured : new File(rootDir, configured.path).canonicalFile
}

def wrapperFor = { File dir ->
    File wrapper = new File(dir, Os.isFamily(Os.FAMILY_WINDOWS) ? 'gradlew.bat' : 'gradlew')
    if (!wrapper.isFile()) {
        throw new GradleException("Gradle wrapper не найден: ${wrapper}")
    }
    return wrapper.absolutePath
}

def sha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read = stream.read(buffer)
        while (read >= 0) {
            digest.update(buffer, 0, read)
            read = stream.read(buffer)
        }
    }
    return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def requireJar = { String label, File file ->
    if (!file.isFile()) {
        throw new GradleException("${label}: final production JAR не найден: ${file}")
    }
    String lower = file.name.toLowerCase(Locale.ROOT)
    if (lower.contains('sources') || lower.contains('javadoc') || lower.contains('gametest') ||
            lower.contains('acceptance') || lower.contains('-api') || lower.contains('-contracts') ||
            lower.contains('-core') || lower.contains('echo-script')) {
        throw new GradleException("${label}: выбран не production runtime JAR: ${file.name}")
    }
    return file
}

def modMetadata = { File jar ->
    ZipFile zip = new ZipFile(jar)
    try {
        def entry = zip.getEntry('META-INF/mods.toml')
        if (entry == null) {
            return [modId: 'unknown', version: 'unknown']
        }
        String text = new String(zip.getInputStream(entry).readAllBytes(), 'UTF-8')
        def modId = (text =~ /(?m)^\s*modId="([^"]+)"/)
        def version = (text =~ /(?m)^\s*version="([^"]+)"/)
        return [
                modId: modId.find() ? modId.group(1) : 'unknown',
                version: version.find() ? version.group(1) : 'unknown'
        ]
    } finally {
        zip.close()
    }
}

