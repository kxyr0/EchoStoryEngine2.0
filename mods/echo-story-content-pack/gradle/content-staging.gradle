tasks.register('installContentJar') {
    group = 'distribution'
    description = 'Копирует только Echo Story Content Pack JAR в -PinstanceDir=<path>/mods.'
    dependsOn tasks.named('contentJar')
    doLast {
        if (!project.hasProperty('instanceDir')) {
            throw new GradleException('Укажите -PinstanceDir=<path>.')
        }
        File instance = file(project.property('instanceDir')).canonicalFile
        if (!instance.isDirectory()) {
            throw new GradleException("instanceDir не существует или не каталог: ${instance}")
        }
        File mods = new File(instance, 'mods')
        if (!mods.exists() && !mods.mkdirs()) {
            throw new GradleException("Не удалось создать mods directory: ${mods}")
        }
        File jar = tasks.named('contentJar').get().archiveFile.get().asFile
        mods.listFiles({ File file -> file.name ==~ /echo-story-content-pack-.*\.jar/ } as FileFilter)
                ?.each { old ->
                    if (!old.delete()) {
                        throw new GradleException("Не удалось удалить старый content pack JAR: ${old}")
                    }
                }
        copy {
            from jar
            into mods
        }
        println "installContentJar: ${new File(mods, jar.name).canonicalPath}"
    }
}

tasks.register('stageStoryPack') {
    group = 'distribution'
    description = 'Собирает build/story-pack из final production JARs.'
    dependsOn tasks.named('contentJar')
    dependsOn tasks.named('prepareRuntimeJars')
    doLast {
        File storyRoot = siblingDir('story_engine_project_dir')
        File dialogueRoot = siblingDir('echo_dialogue_project_dir')
        File npcRoot = siblingDir('echo_npc_project_dir')
        File animationRoot = siblingDir('echo_animation_project_dir')
        File storyDialogueRoot = siblingDir('story_dialogue_adapter_project_dir')
        File storyNpcRoot = siblingDir('story_npc_adapter_project_dir')
        File storyAnimationRoot = siblingDir('story_animation_adapter_project_dir')
        File npcAnimationRoot = siblingDir('npc_animation_adapter_project_dir')
        List<Map<String, Object>> jars = [
                [label: 'Echo Story Engine',
                 source: storyRoot,
                 file: requireJar('Echo Story Engine', new File(storyRoot,
                         "story-forge-1.20.1/build/libs/echo-story-engine-${echo_story_engine_artifact_version}-all.jar"))],
                [label: 'Echo Dialogue',
                 source: dialogueRoot,
                 file: requireJar('Echo Dialogue', new File(dialogueRoot,
                         "dialogue-forge-1.20.1/build/libs/echo-dialogue-${echo_dialogue_version}-all.jar"))],
                [label: 'Story-Dialogue Adapter',
                 source: storyDialogueRoot,
                 file: requireJar('Story-Dialogue Adapter', new File(storyDialogueRoot,
                         "build/libs/echo-story-dialogue-adapter-${echo_story_dialogue_adapter_version}.jar"))],
                [label: 'Echo NPC',
                 source: npcRoot,
                 file: requireJar('Echo NPC', new File(npcRoot,
                         "npc-forge-1.20.1/build/libs/echo-npc-${echo_npc_version}-all.jar"))],
                [label: 'Echo Animation',
                 source: animationRoot,
                 file: requireJar('Echo Animation', new File(animationRoot,
                         "animation-forge-1.20.1/build/libs/echo-animation-${echo_animation_version}-all.jar"))],
                [label: 'NPC-Animation Adapter',
                 source: npcAnimationRoot,
                 file: requireJar('NPC-Animation Adapter', new File(npcAnimationRoot,
                         "build/libs/echo-npc-animation-adapter-${echo_npc_animation_adapter_version}.jar"))],
                [label: 'Story-NPC Adapter',
                 source: storyNpcRoot,
                 file: requireJar('Story-NPC Adapter', new File(storyNpcRoot,
                         "build/libs/echo-story-npc-adapter-${echo_story_npc_adapter_version}.jar"))],
                [label: 'Story-Animation Adapter',
                 source: storyAnimationRoot,
                 file: requireJar('Story-Animation Adapter', new File(storyAnimationRoot,
                         "build/libs/echo-story-animation-adapter-${echo_story_animation_adapter_version}.jar"))],
                [label: 'Echo Story Content Pack',
                 source: rootDir,
                 file: requireJar('Echo Story Content Pack', tasks.named('contentJar').get().archiveFile.get().asFile)]
        ]
        File output = layout.buildDirectory.dir('story-pack').get().asFile
        File mods = new File(output, 'mods')
        delete output
        mods.mkdirs()
        jars.each { item ->
            copy {
                from item.file
                into mods
            }
        }
        List<String> stagedNames = mods.listFiles({ File file -> file.name.endsWith('.jar') } as FileFilter)
                .collect { it.name }
                .sort()
        stagedNames.each { name ->
            String lower = name.toLowerCase(Locale.ROOT)
            if (lower.contains('sources') || lower.contains('javadoc') || lower.contains('gametest') ||
                    lower.contains('acceptance') || lower.contains('-api') || lower.contains('-contracts') ||
                    lower.contains('-core') || lower.contains('echo-script')) {
                throw new GradleException("stageStoryPack выбрал запрещенный JAR: ${name}")
            }
        }
        new File(output, 'README.txt').text = """Echo Story Pack staged runtime

Скопируйте каталог mods в чистый Forge 1.20.1 / Forge ${forge_version} instance.
Content JAR нужен и на dedicated server, и на client, потому что содержит data/ и assets/.
JARs в этом каталоге являются final production artifacts; acceptance/test/API/source JARs не включены.
""" + '\n'
        File versions = new File(output, 'versions.txt')
        versions.text = jars.collect { item ->
            def metadata = modMetadata(item.file as File)
            "${(item.file as File).name}\n" +
                    "  label=${item.label}\n" +
                    "  modId=${metadata.modId}\n" +
                    "  modVersion=${metadata.version}\n" +
                    "  bytes=${(item.file as File).length()}\n" +
                    "  sha256=${sha256(item.file as File)}\n" +
                    "  source=${(item.source as File).canonicalPath}\n"
        }.join('\n')
        println "stageStoryPack: ${output.canonicalPath}"
        println 'stageStoryPack mods:'
        stagedNames.each { println " - ${it}" }
    }
}

