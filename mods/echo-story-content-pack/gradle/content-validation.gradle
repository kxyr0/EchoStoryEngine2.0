tasks.register('verifyContentJar') {
    group = 'verification'
    description = 'Инспектирует фактический content JAR и запрещает runtime/API/EchoScript/test/source-art payload.'
    dependsOn tasks.named('contentJar')
    doLast {
        File jarFile = tasks.named('contentJar').get().archiveFile.get().asFile
        List<String> violations = []
        if (!jarFile.isFile()) {
            violations << "${rel(jarFile)}: JAR не найден."
            failIfAny('verifyContentJar', violations)
        }
        ZipFile zip = new ZipFile(jarFile)
        try {
            List<String> entries = zip.entries().toList().findAll { !it.directory }.collect { it.name }.sort()
            ['META-INF/mods.toml', 'pack.mcmeta', 'story/content-pack/jdh/pack.mcmeta',
             'story/content-pack/jdh/data/jdh/echo_story/stories/chapter_1/home/home_arrival.es',
             'story/content-pack/jdh/data/jdh/echo_dialogue/dialogues/chapter_1/home/home_arrival.dialogue.es',
             'story/content-pack/jdh/data/jdh/echo_npc/npcs/chapter_1/family/john_father.npc.es',
             'story/content-pack/jdh/data/jdh/echo_animation/face_rigs/chapter_1/family/john_father.face-rig.es',
             'story/content-pack/jdh/data/jdh/echo_animation/face_poses/chapter_1/family/john_father_neutral.face-pose.es',
             'story/content-pack/jdh/data/jdh/echo_animation/face_animations/shared/blink.face-animation.es',
             'story/content-pack/jdh/data/jdh/echo_animation/animation_profiles/chapter_1/family/standard_humanoid.animation-profile.es',
             'story/content-pack/jdh/data/jdh/echo_npc_animation/bindings/chapter_1/family/john_father.npc-animation-binding.es',
             'story/configs/jdh/echo_animation/portrait_overlays/john_father.portrait-overlay.es',
             'story/configs/jdh/echo_dialogue/client_overlay/dialogue_overlay.dialogue-overlay.es',
             'story/configs/jdh/echo_thought_space/thought_space.thought-space.es',
             'story/content-pack/jdh/assets/jdh/textures/echo_npc/skins/john_father.png',
             'story/content-pack/jdh/assets/jdh/textures/echo_dialogue/portraits/john_father.png',
             'assets/jdh/textures/echo_npc/skins/john_father.png',
             'assets/jdh/textures/echo_dialogue/portraits/john_father.png'].each { required ->
                if (!entries.contains(required)) {
                    violations << "${required}: отсутствует в production content JAR."
                }
            }
            entries.each { entry ->
                String lower = entry.toLowerCase(Locale.ROOT)
                if (!(entry == 'META-INF/MANIFEST.MF' || entry == 'META-INF/mods.toml' ||
                        entry == 'pack.mcmeta' || entry == 'story/content-pack/jdh/pack.mcmeta' ||
                        entry.startsWith('story/content-pack/jdh/data/') ||
                        entry.startsWith('story/content-pack/jdh/assets/') ||
                        entry.startsWith("assets/${namespace}/") ||
                        entry.startsWith('story/configs/jdh/'))) {
                    violations << "${entry}: unexpected archive entry."
                }
                if ((entry.startsWith('story/content-pack/jdh/data/') ||
                        entry.startsWith('story/content-pack/jdh/assets/') ||
                        entry.startsWith("assets/${namespace}/") ||
                        entry.startsWith('story/configs/jdh/')) && entry =~ /[A-Z ]/) {
                    violations << "${entry}: archive resource path должен быть lowercase и без пробелов."
                }
                if (lower.endsWith('.class') || lower.endsWith('.jar')) {
                    violations << "${entry}: class/JAR запрещен в content JAR."
                }
                if (lower.endsWith('.psd') || lower.endsWith('.xcf') || lower.endsWith('.kra') ||
                        lower.endsWith('.aseprite') || lower.endsWith('.blend')) {
                    violations << "${entry}: source-art file запрещен в content JAR."
                }
                if (lower.endsWith('.ttf') || lower.endsWith('.otf') || lower.endsWith('.woff') ||
                        lower.endsWith('.woff2')) {
                    violations << "${entry}: font file запрещен в content JAR."
                }
                if (entry.startsWith('docs/') || entry.startsWith('authoring/') || entry.startsWith('art-source/') ||
                        entry.startsWith('src/') || entry.startsWith('gradle/') || entry.startsWith('build/')) {
                    violations << "${entry}: repository-only file не должен входить в JAR."
                }
                if (entry.contains('echoscript') || entry.contains('echostoryengine') ||
                        entry.contains('echodialogue') || entry.contains('echonpc')) {
                    violations << "${entry}: runtime/API/EchoScript copy запрещена."
                }
            }
            entries.findAll { it.endsWith('.es') }.each { entry ->
                String text = new String(zip.getInputStream(zip.getEntry(entry)).readAllBytes(), StandardCharsets.UTF_8)
                if (text.contains('content_pack_') || text.contains('echo_story_npc_test') ||
                        text.contains('echo_dialogue_test') || text.contains('sample:')) {
                    violations << "${entry}: acceptance/test/sample ID попал в production JAR."
                }
            }
        } finally {
            zip.close()
        }
        failIfAny('verifyContentJar', violations)
        println "verifyContentJar: OK ${rel(jarFile)} (${jarFile.length()} bytes)"
    }
}

tasks.register('contentReport') {
    group = 'verification'
    description = 'Создает author-facing индекс ресурсов под build/reports/content/.'
    dependsOn tasks.named('validateContent')
    doLast {
        File reportDir = layout.buildDirectory.dir('reports/content').get().asFile
        reportDir.mkdirs()
        def storyResources = filesUnder(mainResources).findAll { resourceRel(mainResources, it).startsWith("data/${namespace}/echo_story/stories/") && it.name.endsWith('.es') }
        def dialogueResources = filesUnder(mainResources).findAll { resourceRel(mainResources, it).startsWith("data/${namespace}/echo_dialogue/dialogues/") && it.name.endsWith('.dialogue.es') }
        def npcResources = filesUnder(mainResources).findAll { resourceRel(mainResources, it).startsWith("data/${namespace}/echo_npc/npcs/") && it.name.endsWith('.npc.es') }
        def animationResources = filesUnder(mainResources).findAll { resourceRel(mainResources, it).startsWith("data/${namespace}/echo_animation/") && it.name.endsWith('.es') }
        def assets = filesUnder(mainResources).findAll { resourceRel(mainResources, it).startsWith("assets/${namespace}/") }
        File md = new File(reportDir, 'content-report.md')
        md.text = """# Echo Story Content Pack content report

Статус build-time validation: OK.

## Production resource files

Story files:
${storyResources.collect { "- `${resourceRel(mainResources, it)}`" }.join('\n')}

Dialogue files:
${dialogueResources.collect { "- `${resourceRel(mainResources, it)}`" }.join('\n')}

NPC files:
${npcResources.collect { "- `${resourceRel(mainResources, it)}`" }.join('\n')}

Echo Animation files:
${animationResources.collect { "- `${resourceRel(mainResources, it)}`" }.join('\n')}

Assets:
${assets.collect { "- `${resourceRel(mainResources, it)}` (${it.length()} bytes)" }.join('\n')}

## Semantic index

Реальные Story/Dialogue/NPC/Animation binders и cross-resource graph проверены задачей
`contentDoctor`. Машиночитаемый отчёт: `build/reports/echo-content-doctor.json`.
""" + '\n'
        File json = new File(reportDir, 'content-report.json')
        json.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                validation: 'OK',
                semanticIndex: 'build/reports/echo-content-doctor.json',
                storyResources: storyResources.collect { resourceRel(mainResources, it) },
                dialogueResources: dialogueResources.collect { resourceRel(mainResources, it) },
                npcResources: npcResources.collect { resourceRel(mainResources, it) },
                animationResources: animationResources.collect { resourceRel(mainResources, it) },
                assets: assets.collect { [path: resourceRel(mainResources, it), bytes: it.length()] }
        ])) + '\n'
        println "contentReport: ${rel(md)}"
    }
}
