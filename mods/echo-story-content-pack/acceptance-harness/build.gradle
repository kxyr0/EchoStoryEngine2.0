plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'echo-story-content-pack-acceptance-harness'
}

repositories {
    maven {
        name = 'EchoStoryIntegration'
        url = uri('../../echo-story-engine/build/integration-maven')
    }
    maven {
        name = 'EchoDialogueIntegration'
        url = uri('../../echo-dialogue/build/integration-maven')
    }
    maven {
        name = 'EchoNpcIntegration'
        url = uri('../../echo-npc/build/integration-maven')
    }
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    flatDir {
        dirs '../../echo-dialogue/dialogue-forge-1.20.1/build/libs'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    def acceptanceRunDir = project.findProperty('acceptanceRunDir') ?: 'run'
    def acceptanceAutoMode = project.findProperty('acceptanceAutoMode')

    runs {
        configureEach {
            args '--nogui'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file(acceptanceRunDir)
            if (acceptanceAutoMode != null) {
                property 'echoStoryContentPackAcceptance.autoMode', acceptanceAutoMode.toString()
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly "io.github.kxyr0.echostoryengine:story-contracts:${story_engine_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-forge-1.20.1:${story_engine_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-contracts:${echo_dialogue_version}"
    compileOnly "io.github.kxyr0.echodialogue:dialogue-forge-api-1.20.1:${echo_dialogue_version}"
    compileOnly "io.github.kxyr0.echonpc:npc-contracts:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echonpc:npc-forge-api-1.20.1:${echo_npc_version}"

    compileOnly fg.deobf(group: 'local', name: 'echo-dialogue', version: echo_dialogue_version, classifier: 'all')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            content_pack_mod_version_range: content_pack_mod_version_range,
            story_engine_mod_version_range: story_engine_mod_version_range,
            echo_dialogue_mod_version_range: echo_dialogue_mod_version_range,
            echo_story_dialogue_adapter_mod_version_range: echo_story_dialogue_adapter_mod_version_range,
            echo_npc_mod_version_range: echo_npc_mod_version_range,
            echo_story_npc_adapter_mod_version_range: echo_story_npc_adapter_mod_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy tasks.named('reobfJar')
}

tasks.named('build') {
    dependsOn tasks.named('reobfJar')
}
