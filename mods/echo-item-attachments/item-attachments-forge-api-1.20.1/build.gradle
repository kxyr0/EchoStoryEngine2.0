plugins { id 'net.minecraftforge.gradle' }

description = 'Forge 1.20.1 public integration boundary for Echo Item Attachments.'
base { archivesName = 'echo-item-attachments-forge-api' }
minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':item-attachments-contracts')
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
