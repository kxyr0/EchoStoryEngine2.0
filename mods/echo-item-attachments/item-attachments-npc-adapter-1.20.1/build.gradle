plugins { id 'net.minecraftforge.gradle' }

description = 'Optional Echo NPC subject, movement, anchor and render adapter.'
base { archivesName = 'echo-item-attachments-npc-adapter' }
minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':item-attachments-contracts')
    implementation project(':item-attachments-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echonpc:npc-contracts:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echonpc:npc-forge-api-1.20.1:${echo_npc_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_version: mod_version, echo_npc_version: echo_npc_version]
    inputs.properties values
    filesMatching('META-INF/mods.toml') { expand values }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
