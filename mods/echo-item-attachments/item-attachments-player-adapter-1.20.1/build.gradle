plugins { id 'net.minecraftforge.gradle' }

description = 'Optional Player Actor control, anchor and first/third-person render adapter.'
base { archivesName = 'echo-item-attachments-player-adapter' }
minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':item-attachments-contracts')
    implementation project(':item-attachments-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echoplayeractor:player-actor-contracts:${echo_player_actor_version}"
    compileOnly "io.github.kxyr0.echoplayeractor:player-actor-forge-api-1.20.1:${echo_player_actor_version}"
    compileOnly "io.github.kxyr0.echonavigation:navigation-contracts:${echo_navigation_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_version: mod_version, echo_player_actor_version: echo_player_actor_version]
    inputs.properties values
    filesMatching('META-INF/mods.toml') { expand values }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
