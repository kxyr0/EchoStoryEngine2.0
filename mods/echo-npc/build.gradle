                        'desired presence',
                        'actor revision',
                        'definition fingerprint',
                        'world identifier',
                        'materialization status',
                        'scene readiness',
                        'active form id',
                        'active form revision',
                        'active form fingerprint',
                        'rest attachment',
                        'rest provider',
                        'canonical bed position',
                        'expected BlockId'
                ],
