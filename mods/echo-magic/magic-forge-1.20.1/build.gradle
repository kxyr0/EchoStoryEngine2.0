plugins { id 'net.minecraftforge.gradle' }

description = 'Forge 1.20.1 runtime host for Echo Magic.'

def embeddedMagicProjects = [
        project(':magic-contracts'), project(':magic-core'),
        project(':magic-forge-api-1.20.1'), project(':magic-script-adapter-1.20.1')
]

configurations {
    embeddedExternalRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

base { archivesName = artifact_name }
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            lazyToken('minecraft_classpath') {
                configurations.embeddedExternalRuntime.copyRecursive().resolve()
                        .collect { it.absolutePath }.join(File.pathSeparator)
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    embeddedMagicProjects.each { module -> source module.sourceSets.main }
                }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

dependencies {
    compileOnly files('../../echo-core/build/libs/echo-core-0.2.0.jar')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':magic-contracts')
    implementation project(':magic-core')
    implementation project(':magic-forge-api-1.20.1')
    implementation project(':magic-script-adapter-1.20.1')
    implementation "io.github.kxyr0.echoscript:echo-script-language:${echo_script_version}"
    embeddedExternalRuntime "io.github.kxyr0.echoscript:echo-script-language:${echo_script_version}"
    jarJar(group: 'io.github.kxyr0.echoscript', name: 'echo-script-api', version: "[${echo_script_version},)") {
        jarJar.pin(it, echo_script_version)
    }
    jarJar(group: 'io.github.kxyr0.echoscript', name: 'echo-script-language', version: "[${echo_script_version},)") {
        jarJar.pin(it, echo_script_version)
    }
}

tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
            mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values + [project: project] }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedMagicProjects.collect { "${it.path}:classes" }
    embeddedMagicProjects.each { module -> from(module.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    dependsOn embeddedMagicProjects.collect { "${it.path}:classes" }
    embeddedMagicProjects.each { module -> from(module.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyProductionJarContents') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('reobfJarJar')
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${artifact_name}-${mod_version}-all.jar").get().asFile
        if (!jarFile.isFile() || jarFile.length() == 0L) throw new GradleException("Missing production JAR: ${jarFile}")
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().each { entries.add(it.name) } }
        def required = ['META-INF/mods.toml',
                'io/github/kxyr0/echomagic/api/identity/SpellId.class',
                'io/github/kxyr0/echomagic/core/catalog/SpellCatalog.class',
                'io/github/kxyr0/echomagic/forge/api/MagicService.class',
                'io/github/kxyr0/echomagic/forge/api/summoned/SummonedWeaponData.class',
                'io/github/kxyr0/echomagic/forge/api/event/MagicLinkCutEvent.class',
                'io/github/kxyr0/echomagic/forge/EchoMagicMod.class',
                'io/github/kxyr0/echomagic/forge/content/MagicSpellHotReload.class',
                'io/github/kxyr0/echomagic/forge/gesture/GesturePositionSwap.class',
                'io/github/kxyr0/echomagic/forge/time/MagicTimeDilation.class',
                'io/github/kxyr0/echomagic/forge/api/teleport/ShortTeleportTargetResolver.class',
                'io/github/kxyr0/echomagic/forge/client/preview/MagicShortTeleportPreview.class',
                'META-INF/jarjar/metadata.json']
        def missing = required.findAll { !entries.contains(it) }
        def forbidden = entries.findAll { it.startsWith('io/github/kxyr0/echomagic/testmod/')
                || it.startsWith('net/minecraft/') || it.startsWith('net/minecraftforge/')
                || it.startsWith('org/junit/') || it.startsWith('docs/') }
        if (!missing.isEmpty() || !forbidden.isEmpty()) {
            throw new GradleException("Production JAR verification failed.\nmissing:\n${missing.join('\n')}"
                    + "\nforbidden:\n${forbidden.take(40).join('\n')}")
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyProductionJarContents') }
