plugins { id 'net.minecraftforge.gradle' }
base { archivesName = 'echo-magic-testmod' }
description = 'Development-only Echo Magic arena and integration checks.'
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}_test" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':magic-contracts')
    implementation project(':magic-core')
    implementation project(':magic-forge-api-1.20.1')
}
tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values + [project: project] }
}
