pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-trigger-player-sleep-adapter'

includeBuild '../echo-trigger'
includeBuild '../echo-player-sleep'
includeBuild '../echo-story-engine'
