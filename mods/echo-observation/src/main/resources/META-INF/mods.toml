modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echo_concentration"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echo_visibility"
mandatory=true
versionRange="[0.1.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="echo_story_engine"
mandatory=false
versionRange="[1.6.0,)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="echo_dialogue"
mandatory=false
versionRange="[0.13.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echo_events"
mandatory=true
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"
