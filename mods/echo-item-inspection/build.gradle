plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
}
ext.prismModsDirectory = providers.gradleProperty('prismModsDirectory').orElse(
        new File(System.getProperty('user.home'), 'AppData/Roaming/PrismLauncher/instances/Форма Мысли/minecraft/mods').path).get()
allprojects {
    version = mod_version
    group = mod_group_id
    repositories {
        mavenCentral()
        flatDir { dirs rootProject.prismModsDirectory }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) }; withSourcesJar() }
    dependencies {
        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
tasks.register('test') { dependsOn subprojects.collect { "${it.path}:test" } }
tasks.named('assemble') { dependsOn subprojects.collect { "${it.path}:assemble" } }
tasks.named('check') { dependsOn subprojects.collect { "${it.path}:check" } }
apply from: 'gradle/verification.gradle'
