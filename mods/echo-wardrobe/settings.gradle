pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-wardrobe'

include 'wardrobe-contracts'
include 'wardrobe-core'
include 'wardrobe-forge-api-1.20.1'
include 'wardrobe-forge-1.20.1'
include 'wardrobe-content-player-adapter-1.20.1'
include 'wardrobe-testmod-1.20.1'
