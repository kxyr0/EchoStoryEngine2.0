plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Forge adapter that contributes resolved Wardrobe appearance to Echo Content Player.'

base {
    archivesName = 'echo-wardrobe-content-player-adapter'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':wardrobe-contracts')
    implementation project(':wardrobe-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echoplayer:player-contracts:${echo_player_version}"
    compileOnly "io.github.kxyr0.echoplayer:player-forge-api-1.20.1:${echo_player_version}"
    testImplementation "io.github.kxyr0.echoplayer:player-contracts:${echo_player_version}"
    testImplementation "io.github.kxyr0.echoplayer:player-forge-api-1.20.1:${echo_player_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
