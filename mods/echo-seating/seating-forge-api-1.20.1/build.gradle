plugins {
    id 'net.minecraftforge.gradle'
}

base {
    archivesName = 'seating-forge-api-1.20.1'
}

description = 'Forge-facing public service and lifecycle events for Echo Seating.'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':seating-contracts')
}
