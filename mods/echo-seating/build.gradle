plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
}

version = mod_version
group = mod_group_id

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

def productionJava = {
    fileTree(rootDir) {
        include 'seating-*/src/main/java/**/*.java'
        exclude '**/build/**'
        exclude 'seating-testmod-1.20.1/**'
    }
}

def productionScripts = {
    fileTree(rootDir) {
        include 'seating-*/src/main/resources/**/*.es'
        exclude '**/build/**'
        exclude 'seating-testmod-1.20.1/**'
    }
}

def checkedTextFiles = {
    fileTree(rootDir) {
        include '*.gradle', 'gradle.properties', '.gitignore'
        include 'config/**/*.xml', 'seating-*/src/**/*.java'
        include 'seating-*/src/**/*.toml', 'seating-*/src/**/*.mcmeta'
        include 'seating-*/src/**/*.json', 'seating-*/src/**/*.es'
        include 'README.md', 'CHANGELOG.md', 'docs/**/*.md'
        exclude '**/build/**', '**/.gradle/**', '**/run/**', '**/.git/**'
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'jacoco'

    version = rootProject.version
    group = rootProject.group

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
    }

    sourceSets {
        architectureTest {
            java.srcDir 'src/architectureTest/java'
            resources.srcDir 'src/architectureTest/resources'
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += output + compileClasspath
        }
    }

    configurations {
        architectureTestImplementation.extendsFrom testImplementation
        architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        architectureTestImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
        architectureTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    checkstyle {
        toolVersion = checkstyle_version
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    }

    pmd {
        toolVersion = pmd_version
        ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
        ruleSets = []
        consoleOutput = true
    }

    tasks.withType(Pmd).configureEach {
        classpath = files()
    }

    jacoco {
        toolVersion = jacoco_version
    }

    tasks.register('architectureTest', Test) {
        description = 'Runs module architecture checks.'
        group = LifecycleBasePlugin.VERIFICATION_GROUP
        testClassesDirs = sourceSets.architectureTest.output.classesDirs
        classpath = sourceSets.architectureTest.runtimeClasspath
        shouldRunAfter tasks.named('test')
    }

    tasks.named('check') {
        dependsOn tasks.named('architectureTest')
    }
}

configure([
        project(':seating-contracts'),
        project(':seating-forge-api-1.20.1')
]) {
    apply plugin: 'maven-publish'

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                name = 'integrationMaven'
                url = rootProject.layout.buildDirectory.dir('integration-maven')
            }
        }
    }
}

tasks.register('publishSeatingIntegrationArtifacts') {
    group = 'publishing'
    description = 'Publishes public Echo Seating artifacts.'
    dependsOn ':seating-contracts:publishMavenJavaPublicationToIntegrationMavenRepository'
    dependsOn ':seating-forge-api-1.20.1:publishMavenJavaPublicationToIntegrationMavenRepository'
}

tasks.register('test') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs unit tests for all Echo Seating modules.'
    dependsOn subprojects.collect { "${it.path}:test" }
}

tasks.register('architectureTest') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs architecture checks for all modules.'
    dependsOn subprojects.collect { "${it.path}:architectureTest" }
}

tasks.register('sourceShapeCheck') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Checks Echo Seating source shape and package limits.'
    doLast {
        def violations = []
        def javaCounts = [:].withDefault { 0 }
        productionJava().files.each { file ->
            def text = file.getText('UTF-8')
            def relative = rootDir.toPath().relativize(file.toPath()).toString()
            javaCounts[file.parentFile.toPath()] = javaCounts[file.parentFile.toPath()] + 1
            if ((text =~ /(?m)^import\s+.*\.\*;/).find()) {
                violations << "${relative}: wildcard import"
            }
            if ((text =~ /(?m)\bstatic\s+(?!final\b)(?:[^;{=()]+)[;=]/).find()) {
                violations << "${relative}: mutable static field candidate"
            }
            if (relative =~ /(?i)(^|[\\\/])(misc|helpers?|more|part1|part2|seating2|zones2|slots2|events2|services2|internal2|impl2)([\\\/]|$)/) {
                violations << "${relative}: forbidden vague directory segment"
            }
            if ((text =~ /(?m)^\s*public\s+(?:final\s+)?(?:class|interface|record|enum)\s+.*(?:Manager|Helper|Utils|Processor|LoggerManager)\b/).find()) {
                violations << "${relative}: forbidden vague production type name"
            }
            def logicalLines = text.readLines().count { line ->
                def trimmed = line.trim()
                trimmed && !trimmed.startsWith('//') && !trimmed.startsWith('*')
            }
            if (logicalLines > 180) {
                violations << "${relative}: ${logicalLines} logical lines; max is 180"
            }
        }
        javaCounts.each { path, count ->
            if (count > 7) {
                violations << "${rootDir.toPath().relativize(path)}: ${count} production files; max is 7"
            }
        }
        productionScripts().files.each { file ->
            def logicalLines = file.getText('UTF-8').readLines().count { line ->
                def trimmed = line.trim()
                trimmed && !trimmed.startsWith('//')
            }
            if (logicalLines > 180) {
                violations << "${rootDir.toPath().relativize(file.toPath())}: ${logicalLines} logical lines; max is 180"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Source shape violations:\n" + violations.join('\n'))
        }
        println 'Source shape: Java files > 180 logical LOC = 0'
        println 'Source shape: EchoScript files > 180 logical LOC = 0'
        println 'Source shape: leaf Java packages > 7 files = 0'
        println 'Source shape: leaf content folders > 7 scripts = 0'
    }
}

tasks.register('checkWhitespace') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Checks UTF-8 text files for tabs, trailing whitespace, and final newlines.'
    doLast {
        def violations = []
        checkedTextFiles().files.each { file ->
            def text = file.getText('UTF-8')
            text.readLines().eachWithIndex { line, index ->
                if (line ==~ /.*[ \t]$/) {
                    violations << "${rootDir.toPath().relativize(file.toPath())}:${index + 1}: trailing whitespace"
                }
                if (line.contains('\t')) {
                    violations << "${rootDir.toPath().relativize(file.toPath())}:${index + 1}: tab"
                }
            }
            if (!text.isEmpty() && !text.endsWith('\n')) {
                violations << "${rootDir.toPath().relativize(file.toPath())}: missing final newline"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Whitespace violations:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { "${it.path}:check" }
    dependsOn tasks.named('architectureTest')
    dependsOn tasks.named('sourceShapeCheck')
    dependsOn tasks.named('checkWhitespace')
    dependsOn tasks.named('publishSeatingIntegrationArtifacts')
}
