pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-trigger'
includeBuild '../echo-events'

include 'trigger-contracts'
include 'trigger-core'
include 'trigger-forge-api-1.20.1'
include 'trigger-forge-1.20.1'
include 'trigger-testmod-1.20.1'

includeBuild '../echo-script'
