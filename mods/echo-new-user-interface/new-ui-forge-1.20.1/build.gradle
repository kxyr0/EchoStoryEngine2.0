plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Forge 1.20.1 client preview overlay for Echo New UI.'

def embeddedNewUiProjects = [
        project(':new-ui-core')
]

base {
    archivesName = artifact_name
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    embeddedNewUiProjects.each { newUiProject -> source newUiProject.sourceSets.main }
                }
            }
        }
        client { }
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':new-ui-core')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedNewUiProjects.collect { "${it.path}:classes" }
    embeddedNewUiProjects.each { newUiProject -> from(newUiProject.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}

tasks.register('verifyProductionJarContents') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies final Echo New UI production JAR contents.'
    dependsOn tasks.named('reobfJar')
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${artifact_name}-${mod_version}.jar").get().asFile
        if (!jarFile.isFile() || jarFile.length() == 0L) {
            throw new GradleException("Production JAR was not created: ${jarFile}")
        }
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry -> entries.add(entry.name) }
        }
        def required = [
                'META-INF/mods.toml',
                'assets/echo_new_user_interface/textures/gui/debug/journal_book.png',
                'io/github/kxyr0/echonewui/core/layout/JournalBookLayout.class',
                'io/github/kxyr0/echonewui/forge/EchoNewUserInterfaceMod.class'
        ]
        def missing = required.findAll { !entries.contains(it) }
        def forbidden = entries.findAll { entry ->
            entry.startsWith('io/github/kxyr0/echodialogue/')
                    || entry.startsWith('net/minecraft/')
                    || entry.startsWith('net/minecraftforge/')
                    || entry.startsWith('org/junit/')
        }
        if (!missing.isEmpty() || !forbidden.isEmpty()) {
            throw new GradleException("Production JAR verification failed."
                    + "\nmissing entries:\n" + missing.join('\n')
                    + "\nforbidden entries:\n" + forbidden.take(40).join('\n'))
        }
        println "Echo New UI production JAR verified: ${jarFile.name}, entries=${entries.size()}"
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionJarContents')
}
