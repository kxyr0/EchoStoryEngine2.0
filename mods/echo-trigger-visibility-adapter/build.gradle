plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java-library'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-contracts:${echo_trigger_version}"
    compileOnly "io.github.kxyr0.echotrigger:trigger-forge-api-1.20.1:${echo_trigger_version}"
    compileOnly "io.github.kxyr0.echovisibility:visibility-contracts:${echo_visibility_version}"
    compileOnly "io.github.kxyr0.echovisibility:visibility-forge-api-1.20.1:${echo_visibility_version}"
    compileOnly "io.github.kxyr0.echonpc:npc-contracts:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echonpc:npc-forge-api-1.20.1:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-contracts:${echo_story_engine_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-api:${echo_story_engine_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-forge-1.20.1:${echo_story_engine_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations { testImplementation.extendsFrom compileOnly }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
checkstyle { toolVersion = checkstyle_version; configFile = rootProject.file('config/checkstyle/checkstyle.xml') }
pmd { toolVersion = pmd_version; ruleSetFiles = rootProject.files('config/pmd/ruleset.xml'); ruleSets = [] }
tasks.withType(Pmd).configureEach { classpath = files() }
tasks.named('processResources', ProcessResources).configure {
    def values = [loader_version_range: loader_version_range, minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values + [project: project] }
}
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.register('sourceShapeCheck') {
    doLast {
        def violations = []
        def counts = [:].withDefault { 0 }
        fileTree(rootDir) { include 'src/main/java/**/*.java'; exclude '**/build/**' }.files.each { file ->
            def text = file.getText('UTF-8')
            def relative = rootDir.toPath().relativize(file.toPath()).toString()
            counts[file.parentFile.toPath()]++
            def logical = text.readLines().count { line ->
                def value = line.trim(); value && !value.startsWith('//') && !value.startsWith('*')
            }
            if (logical > 180) violations << "${relative}: ${logical} logical lines"
        }
        counts.each { path, count ->
            if (count > 7) violations << "${rootDir.toPath().relativize(path)}: ${count} files"
        }
        if (!violations.empty) throw new GradleException(violations.join('\n'))
        println 'Java files > 180 logical LOC = 0'
        println 'leaf Java packages > 7 files = 0'
    }
}
tasks.named('check') { dependsOn tasks.named('sourceShapeCheck') }
