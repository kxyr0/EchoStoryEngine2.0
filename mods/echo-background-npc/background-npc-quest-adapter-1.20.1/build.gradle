plugins { id 'net.minecraftforge.gradle' }
base { archivesName = 'background-npc-quest-adapter-1.20.1' }
description = 'Starts player-scoped Echo Quests after eligible ambient conversations.'
minecraft { mappings channel: mapping_channel, version: mapping_version }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':background-npc-contracts')
    implementation project(':background-npc-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echoquests:quest-contracts:${echo_quests_version}"
    compileOnly "io.github.kxyr0.echoquests:quest-forge-api-1.20.1:${echo_quests_version}"
    testImplementation "io.github.kxyr0.echoquests:quest-contracts:${echo_quests_version}"
    testImplementation "io.github.kxyr0.echoquests:quest-forge-api-1.20.1:${echo_quests_version}"
}
