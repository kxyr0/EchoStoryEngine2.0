plugins { id 'net.minecraftforge.gradle' }
base { archivesName = 'background-npc-time-adapter-1.20.1' }
minecraft { mappings channel: mapping_channel, version: mapping_version }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':background-npc-core')
    compileOnly "io.github.kxyr0.echotime:time-contracts:${echo_time_version}"
    compileOnly "io.github.kxyr0.echotime:time-forge-api-1.20.1:${echo_time_version}"
}
