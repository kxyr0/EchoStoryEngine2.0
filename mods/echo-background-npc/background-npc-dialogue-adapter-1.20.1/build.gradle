plugins { id 'net.minecraftforge.gradle' }
base { archivesName = 'background-npc-dialogue-adapter-1.20.1' }
minecraft { mappings channel: mapping_channel, version: mapping_version }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':background-npc-core')
    compileOnly "io.github.kxyr0.echodialogue:dialogue-forge-api-1.20.1:${echo_dialogue_version}"
}
