pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-player-hud'

include 'player-hud-contracts'
include 'player-hud-core'
include 'player-hud-forge-api-1.20.1'
include 'player-hud-forge-1.20.1'
include 'player-hud-testmod-1.20.1'
