plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Public Forge-facing API for Echo Player HUD metric providers.'

base {
    archivesName = 'player-hud-forge-api-1.20.1'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':player-hud-contracts')
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}
