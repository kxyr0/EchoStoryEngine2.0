plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Forge 1.20.1 runtime host for Echo Player Sleep.'

def embeddedSleepProjects = [
        project(':player-sleep-contracts'),
        project(':player-sleep-core'),
        project(':player-sleep-forge-api-1.20.1')
]

base {
    archivesName = artifact_name
}

jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    embeddedSleepProjects.each { sleepProject -> source sleepProject.sourceSets.main }
                }
            }
        }
        client { }
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':player-sleep-contracts')
    implementation project(':player-sleep-core')
    implementation project(':player-sleep-forge-api-1.20.1')
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedSleepProjects.collect { "${it.path}:classes" }
    embeddedSleepProjects.each { sleepProject -> from(sleepProject.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'MixinConfigs': 'echo_player_sleep.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    dependsOn embeddedSleepProjects.collect { "${it.path}:classes" }
    embeddedSleepProjects.each { sleepProject -> from(sleepProject.sourceSets.main.output) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'MixinConfigs': 'echo_player_sleep.mixins.json'
        ])
    }
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyProductionJarContents') {
    description = 'Verifies final Echo Player Sleep production JAR contents.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('reobfJarJar')
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${artifact_name}-${mod_version}-all.jar").get().asFile
        if (!jarFile.isFile() || jarFile.length() == 0L) {
            throw new GradleException("Production JAR was not created: ${jarFile}")
        }
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry -> entries.add(entry.name) }
        }
        def required = [
                'META-INF/mods.toml',
                'io/github/kxyr0/echoplayersleep/api/id/PlayerSleepScenarioId.class',
                'io/github/kxyr0/echoplayersleep/core/arm/PlayerSleepArmRegistry.class',
                'io/github/kxyr0/echoplayersleep/forge/api/arm/PlayerSleepArmService.class',
                'io/github/kxyr0/echoplayersleep/forge/EchoPlayerSleepMod.class'
        ]
        def missing = required.findAll { !entries.contains(it) }
        def forbidden = entries.findAll { entry ->
            entry.startsWith('io/github/kxyr0/echoplayersleep/testmod/')
                    || entry.startsWith('net/minecraft/')
                    || entry.startsWith('net/minecraftforge/')
                    || entry.startsWith('org/junit/')
                    || entry.startsWith('docs/')
                    || entry.endsWith('.java')
        }
        if (!missing.isEmpty() || !forbidden.isEmpty()) {
            throw new GradleException("Production JAR verification failed."
                    + "\nmissing entries:\n" + missing.join('\n')
                    + "\nforbidden entries:\n" + forbidden.take(40).join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionJarContents')
}
