plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Development-only Forge test mod for Echo Player Sleep.'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':player-sleep-contracts')
    implementation project(':player-sleep-forge-api-1.20.1')
}
