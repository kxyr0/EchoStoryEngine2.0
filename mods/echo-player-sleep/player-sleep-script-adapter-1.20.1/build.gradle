plugins {
    id 'net.minecraftforge.gradle'
}

description = 'Forge 1.20.1 Echo Story extension adapter exposing Sleep.* commands.'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    api project(':player-sleep-contracts')
    implementation project(':player-sleep-core')
    implementation project(':player-sleep-forge-api-1.20.1')
    compileOnly "io.github.kxyr0.echostoryengine:story-contracts:${echo_story_engine_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-api:${echo_story_engine_version}"
    compileOnly "io.github.kxyr0.echostoryengine:story-extension-forge-1.20.1:${echo_story_engine_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
