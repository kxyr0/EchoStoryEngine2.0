pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-voice'
include 'voice-contracts'
include 'voice-core'
include 'voice-forge-api-1.20.1'
include 'voice-forge-1.20.1'
include 'voice-testmod-1.20.1'
