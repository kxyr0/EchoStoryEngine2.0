plugins { id 'net.minecraftforge.gradle' }

description = 'Development-only Echo Voice acceptance mod.'
base { archivesName = 'echo-voice-testmod' }
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                echo_voice { source project(':voice-forge-1.20.1').sourceSets.main }
                echo_voice_testmod { source sourceSets.main }
            }
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':voice-forge-api-1.20.1')
}
tasks.named('processResources', ProcessResources).configure {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand(mod_version: mod_version) }
}
