plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = artifact_name }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories {
    mavenCentral()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'EchoMagicSibling'; url = file('../echo-magic/build/integration-maven').toURI() }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")
    implementation "io.github.kxyr0.echomagic:magic-forge-api-1.20.1:${echo_magic_version}"
}

tasks.register('prepareMagicArtifacts', Exec) {
    workingDir file('../echo-magic')
    commandLine new File(workingDir, org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? 'gradlew.bat' : 'gradlew').absolutePath,
            'publishMagicIntegrationArtifacts', '--console=plain'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('prepareMagicArtifacts')
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
            mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description, epicfight_version_range: epicfight_version_range,
            echo_magic_version_range: echo_magic_version_range]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values + [project: project] }
}

tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

tasks.register('sourceShapeCheck') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    doLast {
        def violations = []
        def counts = [:].withDefault { 0 }
        fileTree(rootDir) { include 'src/main/java/**/*.java'; exclude '**/build/**' }.files.each { file ->
            def text = file.getText('UTF-8')
            counts[file.parentFile.toPath()]++
            def logical = text.readLines().count {
                it.trim() && !it.trim().startsWith('//') && !it.trim().startsWith('*')
            }
            if (logical > 200) violations << "${file}: ${logical} logical lines; max is 200"
        }
        counts.each { path, count -> if (count > 7) violations << "${path}: ${count} Java files; max is 7" }
        if (!violations.isEmpty()) throw new GradleException("Source shape violations:\n" + violations.join('\n'))
        println 'Source shape: max 200 logical lines per Java file, max 7 Java files per package.'
    }
}

tasks.register('verifyAdapterJarContents') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().each { entries.add(it.name) } }
        def required = ['META-INF/mods.toml',
                'io/github/kxyr0/echomagic/epicfight/EchoMagicEpicFightMod.class',
                'io/github/kxyr0/echomagic/epicfight/client/EpicFightHandAnchor.class',
                'io/github/kxyr0/echomagic/epicfight/client/SummonedWeaponFrameRenderer.class',
                'io/github/kxyr0/echomagic/epicfight/client/SummonedWeaponRibbonRenderer.class',
                'io/github/kxyr0/echomagic/epicfight/client/SummonedWeaponEpicFightTrail.class',
                'io/github/kxyr0/echomagic/epicfight/server/SummonedWeaponEpicFightPulse.class',
                'assets/echo_magic_epicfight/particles/weapon_glow.json',
                'assets/echo_magic_epicfight/textures/particle/weapon_circle.png',
                'io/github/kxyr0/echomagic/epicfight/client/SummonedWeaponParticleRenderer.class']
        def forbidden = entries.findAll { it.startsWith('yesman/epicfight/')
                || it.startsWith('io/github/kxyr0/echomagic/forge/') || it.startsWith('net/minecraft/') }
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty() || !forbidden.isEmpty()) throw new GradleException(
                "Adapter JAR verification failed.\nmissing:\n${missing.join('\n')}\nforbidden:\n${forbidden.join('\n')}")
    }
}

tasks.named('check') {
    dependsOn tasks.named('sourceShapeCheck')
    dependsOn tasks.named('verifyAdapterJarContents')
}
