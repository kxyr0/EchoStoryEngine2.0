plugins { id 'net.minecraftforge.gradle' }
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation project(':')
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    archiveBaseName = 'echo-events'
    from rootProject.sourceSets.main.output
    finalizedBy 'reobfJar'
}
