plugins { id 'net.minecraftforge.gradle' }

description = 'Development-only GameTest module for NPC backpack compatibility.'
base { archivesName = 'echo-npc-sophisticated-backpacks-testmod' }
def modsDir = providers.gradleProperty('sophisticated_mods_dir').map { file(it) }.getOrElse(
        new File(System.getenv('APPDATA'), 'PrismLauncher/instances/Форма Мысли/minecraft/mods'))
repositories {
    flatDir {
        dirs modsDir
        dirs new File(rootDir, '../echo-npc/npc-forge-1.20.1/build/libs')
        dirs new File(rootDir, '../echo-navigation/navigation-forge-1.20.1/build/libs')
    }
}
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            args '--nogui'
            mods {
                "${mod_id}" {
                    source project(':npc-backpack-forge-1.20.1').sourceSets.main
                    source project(':npc-backpack-contracts').sourceSets.main
                    source project(':npc-backpack-core').sourceSets.main
                }
                echo_npc_sophisticated_backpacks_testmod { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':npc-backpack-forge-1.20.1')
    compileOnly project(':npc-backpack-contracts')
    compileOnly project(':npc-backpack-core')
    compileOnly fg.deobf("local:sophisticatedbackpacks-1.20.1:${sophisticated_backpacks_version}")
    compileOnly fg.deobf("local:sophisticatedcore-1.20.1:${sophisticated_core_version}")
    runtimeOnly fg.deobf("local:echo-npc:${echo_npc_version}:all")
    runtimeOnly fg.deobf("local:echo-navigation:${echo_navigation_version}:all")
    runtimeOnly fg.deobf("local:sophisticatedbackpacks-1.20.1:${sophisticated_backpacks_version}")
    runtimeOnly fg.deobf("local:sophisticatedcore-1.20.1:${sophisticated_core_version}")
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('processResources')
    doLast {
        copy {
            from sourceSets.main.resources
            include 'gameteststructures/**'
            into project.file('run')
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def gameTestLog = file('run/logs/latest.log')
        def output = gameTestLog.exists() ? gameTestLog.getText('UTF-8') : ''
        if (!output.contains('All 1 required tests passed')) {
            throw new GradleException("GameTest success marker is missing from ${gameTestLog}")
        }
    }
}
