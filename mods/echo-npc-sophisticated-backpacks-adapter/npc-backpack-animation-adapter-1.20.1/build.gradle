plugins { id 'net.minecraftforge.gradle' }

description = 'Optional Echo Animation marker integration for NPC backpacks.'
base { archivesName = 'echo-npc-sophisticated-backpacks-animation-adapter' }
minecraft { mappings channel: mapping_channel, version: mapping_version }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':npc-backpack-contracts')
    implementation project(':npc-backpack-core')
    compileOnly project(':npc-backpack-forge-1.20.1')
    compileOnly "io.github.kxyr0.echonpc:npc-forge-api-1.20.1:${echo_npc_version}"
    compileOnly "io.github.kxyr0.echoanimation:animation-contracts:${echo_animation_version}"
    compileOnly "io.github.kxyr0.echoanimation:animation-forge-api-1.20.1:${echo_animation_version}"
    testImplementation "io.github.kxyr0.echoanimation:animation-contracts:${echo_animation_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_version: mod_version, echo_animation_version: echo_animation_version]
    inputs.properties values
    filesMatching('META-INF/mods.toml') { expand values }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
