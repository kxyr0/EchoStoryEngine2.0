pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'echo-npc-sophisticated-backpacks-adapter'

include 'npc-backpack-contracts'
include 'npc-backpack-core'
include 'npc-backpack-forge-1.20.1'
include 'npc-backpack-script-adapter-1.20.1'
include 'npc-backpack-animation-adapter-1.20.1'
include 'npc-backpack-testmod-1.20.1'

includeBuild '../echo-npc'
includeBuild '../echo-navigation'
includeBuild '../echo-animation'
includeBuild '../echo-script'
includeBuild '../echo-story-engine'
includeBuild '../echo-dialogue'
includeBuild '../echo-trigger'
