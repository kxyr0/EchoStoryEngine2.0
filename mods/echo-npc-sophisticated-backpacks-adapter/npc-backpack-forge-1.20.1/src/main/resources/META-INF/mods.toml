modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echo_npc"
mandatory=true
versionRange="[${echo_npc_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echo_navigation"
mandatory=true
versionRange="[${echo_navigation_version},)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
mandatory=true
versionRange="[${sophisticated_backpacks_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedcore"
mandatory=true
versionRange="[${sophisticated_core_version},)"
ordering="AFTER"
side="BOTH"
