tasks.register('verifySiblingPublicArtifacts') {
    description = 'Проверяет наличие ожидаемых Dialogue/NPC public artifacts в generated Maven repositories.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('publishDialogueIntegrationArtifacts')
    dependsOn tasks.named('publishEchoNpcIntegrationArtifacts')
    doLast {
        def dialogueRepo = file("${echo_dialogue_project_dir}/build/integration-maven/io/github/kxyr0/echodialogue")
        def npcRepo = file("${echo_npc_project_dir}/build/integration-maven/io/github/kxyr0/echonpc")
        def required = [
                [dialogueRepo, 'dialogue-contracts', echo_dialogue_version],
                [dialogueRepo, 'dialogue-presentation-api', echo_dialogue_version],
                [dialogueRepo, 'dialogue-forge-api-1.20.1', echo_dialogue_version],
                [npcRepo, 'npc-contracts', echo_npc_version],
                [npcRepo, 'npc-forge-api-1.20.1', echo_npc_version],
        ]
        def missing = []
        required.each { spec ->
            def versionDir = file("${spec[0]}/${spec[1]}/${spec[2]}")
            def exact = file("${versionDir}/${spec[1]}-${spec[2]}.jar")
            def jars = versionDir.isDirectory()
                    ? versionDir.listFiles().findAll { it.name.endsWith('.jar') && !it.name.contains('-sources') }
                    : []
            if (!exact.isFile() && jars.isEmpty()) {
                missing << exact
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Public artifacts не найдены:\n" + missing.join('\n'))
        }
        println "Dialogue/NPC public artifacts verified: ${required.size()} coordinates."
    }
}

def wrapperFor = { File dir ->
    File wrapper = new File(dir, Os.isFamily(Os.FAMILY_WINDOWS) ? 'gradlew.bat' : 'gradlew')
    if (!wrapper.isFile()) {
        throw new GradleException("Gradle wrapper не найден: ${wrapper}")
    }
    return wrapper.absolutePath
}

def requireProductionJar = { String label, File file ->
    if (!file.isFile()) {
        throw new GradleException("${label}: final production JAR не найден: ${file}")
    }
    String lower = file.name.toLowerCase(Locale.ROOT)
    if (lower.contains('sources') || lower.contains('javadoc') || lower.contains('gametest')
            || lower.contains('acceptance') || lower.contains('-api') || lower.contains('-contracts')
            || lower.contains('-core') || lower.contains('echo-script')) {
        throw new GradleException("${label}: выбран не production runtime JAR: ${file.name}")
    }
    return file
}

def modMetadata = { File jar ->
    ZipFile zip = new ZipFile(jar)
    try {
        def entry = zip.getEntry('META-INF/mods.toml')
        if (entry == null) {
            return [modId: 'unknown', version: 'unknown']
        }
        String text = new String(zip.getInputStream(entry).readAllBytes(), 'UTF-8')
        def modId = (text =~ /(?m)^\s*modId="([^"]+)"/)
        def version = (text =~ /(?m)^\s*version="([^"]+)"/)
        return [
                modId: modId.find() ? modId.group(1) : 'unknown',
                version: version.find() ? version.group(1) : 'unknown'
        ]
    } finally {
        zip.close()
    }
}

