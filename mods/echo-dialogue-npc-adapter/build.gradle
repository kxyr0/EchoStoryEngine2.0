                || !stagedNames.contains(expectedHarness)) {
            throw new GradleException("stageN4ProductionClientVisualAcceptance: unexpected mod set."
                    + "\nstaged=${stagedNames}")
        }
        new File(output, 'README.txt').setText(
                "N4 production client visual acceptance: C1 production final JARs plus test-only client harness.\n",
                'UTF-8')
        println "stageN4ProductionClientVisualAcceptance: ${output.canonicalPath}"
        stagedNames.each { println " - ${it}" }
    }
}

