def siblingDir = { String propertyName ->
    File configured = file(project.findProperty(propertyName) ?: '')
    configured.isAbsolute() ? configured : new File(rootDir, configured.path).canonicalFile
}

def gameTestModClasses = { String runtimeModId, File runtimeRoot, List<String> relativePaths ->
    relativePaths.collect { relative -> "${runtimeModId}%%${new File(runtimeRoot, relative).absolutePath}" }
            .join(File.pathSeparator)
}

def dialogueGameTestRuntimePaths = [
        'dialogue-forge-1.20.1/build/resources/main',
        'dialogue-forge-1.20.1/build/classes/java/main',
        'dialogue-contracts/build/classes/java/main',
        'dialogue-presentation-api/build/classes/java/main',
        'dialogue-core/build/classes/java/main',
        'dialogue-persistence/build/classes/java/main',
        'dialogue-echoscript-adapter/build/classes/java/main',
        'dialogue-forge-api-1.20.1/build/classes/java/main',
]

def npcGameTestRuntimePaths = [
        'npc-forge-1.20.1/build/resources/main',
        'npc-forge-1.20.1/build/classes/java/main',
        'npc-contracts/build/classes/java/main',
        'npc-core/build/classes/java/main',
        'npc-persistence/build/classes/java/main',
        'npc-echoscript-adapter/build/classes/java/main',
        'npc-forge-api-1.20.1/build/classes/java/main',
]

def dialogueImplementationClasspath = {
    File root = siblingDir('echo_dialogue_project_dir')
    files(dialogueGameTestRuntimePaths.collect { new File(root, it) })
}

def dialogueGameTestModClasses = {
    File root = siblingDir('echo_dialogue_project_dir')
    gameTestModClasses('echo_dialogue', root, dialogueGameTestRuntimePaths)
}

def npcGameTestModClasses = {
    File root = siblingDir('echo_npc_project_dir')
    gameTestModClasses('echo_npc', root, npcGameTestRuntimePaths)
}

def adapterGameTestModClasses = {
    gameTestModClasses(mod_id, rootDir, [
            'build/resources/main',
            'build/classes/java/main',
            'build/resources/gameTest',
            'build/classes/java/gameTest',
    ])
}

def adapterMainModClasses = {
    gameTestModClasses(mod_id, rootDir, [
            'build/resources/main',
            'build/classes/java/main',
    ])
}

def clientAcceptanceHarnessModClasses = {
    gameTestModClasses('echo_dialogue_npc_adapter_client_acceptance', rootDir, [
            'build/resources/clientAcceptanceHarness',
            'build/classes/java/clientAcceptanceHarness',
    ])
}

def clientDialogueAccessModClasses = {
    gameTestModClasses('echo_dialogue', rootDir, [
            'build/classes/java/clientDialogueAccess',
    ])
}

def siblingGameTestModClasses = {
    [dialogueGameTestModClasses(), npcGameTestModClasses()].join(File.pathSeparator)
}

def allGameTestModClasses = {
    [siblingGameTestModClasses(), adapterGameTestModClasses()].join(File.pathSeparator)
}

def allClientAcceptanceModClasses = {
    [
            dialogueGameTestModClasses(),
            clientDialogueAccessModClasses(),
            npcGameTestModClasses(),
            adapterMainModClasses(),
            clientAcceptanceHarnessModClasses()
    ].join(File.pathSeparator)
}

def requiredGameTestRuntimeDirs = {
    File dialogueRoot = siblingDir('echo_dialogue_project_dir')
    File npcRoot = siblingDir('echo_npc_project_dir')
    def dialogueDirs = dialogueGameTestRuntimePaths.collect { new File(dialogueRoot, it) }
    def npcDirs = npcGameTestRuntimePaths.collect { new File(npcRoot, it) }
    dialogueDirs + npcDirs
}

