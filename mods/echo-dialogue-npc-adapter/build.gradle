tasks.register('stageN4AcceptanceStoryPack') {
    description = 'Складывает Story acceptance runtime, N4 adapter и N4 acceptance harness.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('stageSiblingAcceptanceStoryPack')
    dependsOn tasks.named('reobfJar')
    dependsOn tasks.named('acceptanceHarnessJar')
    doLast {
        File contentRoot = siblingDir('echo_story_content_pack_project_dir')
        File contentMods = new File(contentRoot, 'build/acceptance-story-pack/mods')
        if (!contentMods.isDirectory()) {
            throw new GradleException("Content Pack acceptance mods не найдены: ${contentMods}")
        }
        File adapterJar = requireProductionJar('Echo Dialogue NPC Adapter',
                layout.buildDirectory.file("libs/${artifact_name}-${mod_version}.jar").get().asFile)
        File harnessJar = tasks.named('acceptanceHarnessJar').get().archiveFile.get().asFile
        File output = layout.buildDirectory.dir('n4-acceptance-story-pack').get().asFile
        File mods = new File(output, 'mods')
        delete output
        mods.mkdirs()
        copy {
            from contentMods
            into mods
        }
        copy {
            from adapterJar
            into mods
        }
        copy {
            from harnessJar
            into mods
        }
        List<String> stagedNames = mods.listFiles({ File file -> file.name.endsWith('.jar') } as FileFilter)
                .collect { it.name }
                .sort()
        List<String> requiredNames = [
                "echo-dialogue-${echo_dialogue_version}-all.jar",
                "echo-npc-${echo_npc_version}-all.jar",
                "${artifact_name}-${mod_version}.jar",
                "${artifact_name}-acceptance-harness-${mod_version}.jar"
        ].collect { it.toString() }
        def missing = requiredNames.findAll { !stagedNames.contains(it) }
        if (!missing.isEmpty() || stagedNames.size() != 10) {
            throw new GradleException("stageN4AcceptanceStoryPack: unexpected mod set."
                    + "\nmissing=${missing}\nstaged=${stagedNames}")
        }
        new File(output, 'README.txt').setText(
                "N4 acceptance runtime: Story acceptance pack plus Echo Dialogue NPC Adapter.\n"
                        + "Этот набор test-only и не является production packaging proof.\n",
                'UTF-8')
        println "stageN4AcceptanceStoryPack: ${output.canonicalPath}"
        stagedNames.each { println " - ${it}" }
    }
}

tasks.register('runN4AcceptanceStoryPackServer') {
    description = 'Runs Story acceptance server plus N4 harness against real NpcService and spawned actor.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('stageN4AcceptanceStoryPack')
    doLast {
        File runDir = runtimeServerDir('n4-acceptance-runtime-server')
        prepareServerRunDir(runDir, layout.buildDirectory.dir('n4-acceptance-story-pack/mods').get().asFile)
        List<String> markers = [
                'EDNA-ACCEPTANCE PASS dynamic-line-choice',
                'ESCPC-ACCEPTANCE AUTO_PASS scenarios=accepted,refused'
        ]
        runForgeServerUntilMarkers(runDir, 'runN4AcceptanceStoryPackServer',
                ['-DechoDialogueNpcAdapterAcceptance.autoMode=dynamic',
                 '-DechoStoryContentPackAcceptance.autoMode=acceptance'],
                markers)
        File logFile = new File(runDir, 'logs/latest.log')
        verifyLogContains(logFile, 'runN4AcceptanceStoryPackServer',
                ['Done (', 'echo_dialogue_npc_adapter:npc_presentation'] + markers)
        verifyLogClean(logFile, 'runN4AcceptanceStoryPackServer')
        copyRuntimeLog(runDir, 'n4-acceptance-story-pack-server-latest.log')
        println "runN4AcceptanceStoryPackServer: OK ${runDir.canonicalPath}"
    }
}

tasks.register('runN4AcceptanceRestartChoiceServer') {
    description = 'Runs N4 acceptance restart at CHOICE using the same persisted server world.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('stageN4AcceptanceStoryPack')
    doLast {
        File runDir = runtimeServerDir('n4-acceptance-restart-choice-server')
        File stagedMods = layout.buildDirectory.dir('n4-acceptance-story-pack/mods').get().asFile
        String executionId = 'jdh:n4_restart_choice'
        prepareServerRunDir(runDir, stagedMods)
        runForgeServerCommandsUntilMarkers(runDir, 'runN4AcceptanceRestartChoiceServer:first',
                ['-DechoDialogueNpcAdapterAcceptance.autoMode=dynamic'],
                ["echo_story_content_pack_acceptance run_until_choice accepted ${executionId}"],
                ['EDNA-ACCEPTANCE PASS dynamic-line-choice',
                 'ESCPC-ACCEPTANCE PAUSE_CHOICE scenario=accepted'])
        File firstLog = copyRuntimeLog(runDir, 'n4-acceptance-restart-choice-first.log')
        prepareServerRunDirKeepingWorld(runDir, stagedMods)
        runForgeServerCommandsUntilMarkers(runDir, 'runN4AcceptanceRestartChoiceServer:second',
                ['-DechoDialogueNpcAdapterAcceptance.autoMode=dynamic'],
                ["echo_story_content_pack_acceptance resume_choice accepted ${executionId}"],
                ['EDNA-ACCEPTANCE PASS dynamic-line-choice',
                 'ESCPC-ACCEPTANCE RESUME_CHOICE scenario=accepted',
                 'ESCPC-ACCEPTANCE PASS scenario=accepted'])
        File secondLog = copyRuntimeLog(runDir, 'n4-acceptance-restart-choice-second.log')
        verifyLogContains(firstLog, 'runN4AcceptanceRestartChoiceServer:first',
                ['story-action/jdh:n4_restart_choice/play_greeting', 'revision=2',
                 'ESCPC-ACCEPTANCE PAUSE_CHOICE scenario=accepted'])
        verifyLogContains(secondLog, 'runN4AcceptanceRestartChoiceServer:second',
                ['story-action/jdh:n4_restart_choice/play_greeting',
                 'ESCPC-ACCEPTANCE PASS scenario=accepted',
                 'outcome=jdh:content_pack_accepted'])
        verifyLogClean(firstLog, 'runN4AcceptanceRestartChoiceServer:first')
        verifyLogClean(secondLog, 'runN4AcceptanceRestartChoiceServer:second')
        println "runN4AcceptanceRestartChoiceServer: OK ${runDir.canonicalPath}"
    }
}

def requiredN4GameTests = [
        'DialogueNpcPresentationGameTests.dynamicLineUsesNpcPresentation',
        'DialogueNpcPresentationGameTests.dynamicChoiceUsesNpcPresentation',
        'DialogueNpcPresentationGameTests.actorWithoutSkinKeepsAuthoredVisual',
        'DialogueNpcPresentationGameTests.missingActorDoesNotClaimSpeaker',
        'DialogueNpcPresentationGameTests.unavailableNpcServiceDoesNotClaimSpeaker',
        'DialogueNpcPresentationGameTests.absentActorDoesNotClaimSpeaker',
        'DialogueNpcPresentationGameTests.stoppedNpcServiceUsesTemporaryFallback',
        'DialogueNpcPresentationGameTests.failedNpcQueryUsesFailureFallback',
        'DialogueNpcPresentationGameTests.blockedActorUsesFailureFallback'
]

tasks.matching { it.name == 'compileGameTestJava' }.configureEach {
    dependsOn tasks.named('verifySiblingPublicArtifacts')
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('stageGameTestRuntimeMods')
    dependsOn tasks.named('processGameTestResources')
    doLast {
        copy {
            from sourceSets.gameTest.resources
            include 'gameteststructures/**'
            into project.file('run')
        }
    }
}

tasks.matching { it.name == 'prepareRunClient' }.configureEach {
    if (project.hasProperty('n4ClientVisualAcceptance')) {
        dependsOn tasks.named('stageN4ClientVisualAcceptanceRuntime')
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('n4ClientVisualAcceptance')) {
        dependsOn tasks.named('stageN4ClientVisualAcceptanceRuntime')
        finalizedBy tasks.named('verifyN4ClientVisualAcceptanceOutputs')
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def logFile = project.file('run/logs/latest.log')
        if (!logFile.isFile()) {
            throw new GradleException("GameTest log was not created: ${logFile}")
        }
        def text = logFile.getText('UTF-8')
        def missing = requiredN4GameTests.findAll { testName ->
            !text.contains("EDNA-GAMETEST-RUN ${testName}")
        }
        def discovered = firstInt(text, /Running test batch '[^']+' \((\d+) tests\)/)
        def executed = firstInt(text, /(\d+) tests are now running!/)
        def passed = firstInt(text, /All (\d+) required tests passed/)
        if (discovered <= 0 || executed <= 0 || passed <= 0 || !missing.isEmpty()) {
            throw new GradleException("N4 GameTests were not fully verified."
                    + "\ndiscovered=${discovered}, executed=${executed}, passed=${passed}"
                    + "\nmissing markers=${missing.join(', ')}")
        }
        println "N4 GameTests verified: discovered=${discovered}, executed=${executed}, passed=${passed}"
    }
}

int firstInt(String text, String pattern) {
    def matcher = text =~ pattern
    return matcher.find() ? matcher.group(1).toInteger() : 0
}

