def runForgeServer = { File runDir, String taskName, List<String> commands ->
    File argsFile = installForgeServer(runDir)
    List<String> command = ['java', '@user_jvm_args.txt', "@${argsFile.absolutePath}", '--nogui']
            .collect { it.toString() }
    Process process = new ProcessBuilder(command)
            .directory(runDir)
            .redirectErrorStream(true)
            .start()
    StringBuilder output = new StringBuilder()
    AtomicBoolean commandBlockSent = new AtomicBoolean(false)
    AtomicBoolean doneSeen = new AtomicBoolean(false)
    Thread reader = new Thread({
        process.inputStream.withReader('UTF-8') { reader ->
            String line = reader.readLine()
            while (line != null) {
                println line
                output.append(line).append(System.lineSeparator())
                if (line.contains('Done (') && commandBlockSent.compareAndSet(false, true)) {
                    commands.each { commandText ->
                        process.outputStream.write((commandText + System.lineSeparator()).getBytes('UTF-8'))
                        process.outputStream.flush()
                        Thread.sleep(300)
                    }
                    Thread.sleep(1000)
                    process.outputStream.write(('stop' + System.lineSeparator()).getBytes('UTF-8'))
                    process.outputStream.flush()
                    doneSeen.set(true)
                }
                line = reader.readLine()
            }
        }
    } as Runnable, "${taskName}-stdout")
    reader.start()
    if (!process.waitFor(180, TimeUnit.SECONDS)) {
        process.destroyForcibly()
        throw new GradleException("${taskName}: Forge server did not exit before timeout.\n${output}")
    }
    reader.join(5000)
    if (process.exitValue() != 0) {
        throw new GradleException("${taskName}: Forge server exited with ${process.exitValue()}.\n${output}")
    }
    if (!doneSeen.get()) {
        throw new GradleException("${taskName}: Forge server never reached Done.\n${output}")
    }
}

def verifyLogContains = { File logFile, String taskName, List<String> markers ->
    if (!logFile.isFile()) {
        throw new GradleException("${taskName}: log file not found: ${logFile}")
    }
    String log = logFile.getText('UTF-8')
    markers.each { marker ->
        if (!log.contains(marker)) {
            throw new GradleException("${taskName}: log marker not found: ${marker}")
        }
    }
}

def verifyLogClean = { File logFile, String taskName ->
    String log = logFile.getText('UTF-8')
    ['FATAL', 'NoClassDefFoundError', 'ClassNotFoundException', 'NoSuchMethodError',
     'Unknown or incomplete command', 'Failed to start', 'encountered an error', '????', '�'].each { marker ->
        if (log.contains(marker)) {
            throw new GradleException("${taskName}: forbidden log marker found: ${marker}")
        }
    }
}

def runForgeServerUntilMarkers = { File runDir, String taskName, List<String> jvmArgs, List<String> markers ->
    File argsFile = installForgeServer(runDir)
    List<String> command = (['java'] + jvmArgs + ['@user_jvm_args.txt', "@${argsFile.absolutePath}", '--nogui'])
            .collect { it.toString() }
    Process process = new ProcessBuilder(command)
            .directory(runDir)
            .redirectErrorStream(true)
            .start()
    StringBuilder output = new StringBuilder()
    Set<String> seenMarkers = Collections.synchronizedSet(new LinkedHashSet<String>())
    AtomicBoolean doneSeen = new AtomicBoolean(false)
    AtomicBoolean stopSent = new AtomicBoolean(false)
    Thread reader = new Thread({
        process.inputStream.withReader('UTF-8') { reader ->
            String line = reader.readLine()
            while (line != null) {
                println line
                output.append(line).append(System.lineSeparator())
                if (line.contains('Done (')) {
                    doneSeen.set(true)
                }
                markers.each { marker ->
                    if (line.contains(marker)) {
                        seenMarkers.add(marker)
                    }
                }
                if (seenMarkers.containsAll(markers) && stopSent.compareAndSet(false, true)) {
                    process.outputStream.write(('stop' + System.lineSeparator()).getBytes('UTF-8'))
                    process.outputStream.flush()
                }
                line = reader.readLine()
            }
        }
    } as Runnable, "${taskName}-stdout")
    reader.start()
    if (!process.waitFor(240, TimeUnit.SECONDS)) {
        process.destroyForcibly()
        throw new GradleException("${taskName}: Forge server did not exit before timeout."
                + "\nseenMarkers=${seenMarkers}\n${output}")
    }
    reader.join(5000)
    if (process.exitValue() != 0) {
        throw new GradleException("${taskName}: Forge server exited with ${process.exitValue()}.\n${output}")
    }
    if (!doneSeen.get()) {
        throw new GradleException("${taskName}: Forge server never reached Done.\n${output}")
    }
    if (!seenMarkers.containsAll(markers)) {
        throw new GradleException("${taskName}: not all acceptance markers were seen."
                + "\nrequired=${markers}\nseen=${seenMarkers}\n${output}")
    }
}

def runForgeServerCommandsUntilMarkers = { File runDir, String taskName, List<String> jvmArgs, List<String> commands,
                                           List<String> markers ->
    File argsFile = installForgeServer(runDir)
