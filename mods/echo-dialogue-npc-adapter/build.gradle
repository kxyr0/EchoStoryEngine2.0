    architectureTest {
        java.srcDir 'src/architectureTest/java'
        resources.srcDir 'src/architectureTest/resources'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    gameTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    acceptanceHarness {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    clientDialogueAccess {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + configurations.testRuntimeClasspath
        compileClasspath += dialogueImplementationClasspath()
        compileClasspath += files(new File(siblingDir('echo_ui_animations_project_dir'),
                "build/libs/echo-ui-animations-${echo_ui_animations_version}.jar"))
        runtimeClasspath += output + compileClasspath
    }
    clientAcceptanceHarness {
        compileClasspath += sourceSets.main.output + sourceSets.clientDialogueAccess.output
        compileClasspath += configurations.compileClasspath + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    productionClientHarness {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + configurations.testRuntimeClasspath
        compileClasspath += dialogueImplementationClasspath()
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
    gameTestEmbeddedExternalRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    }
    forgeServerInstaller {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            if (project.hasProperty('n4ClientVisualAcceptance')) {
                workingDirectory project.file('run-client-visual')
                args '--username', 'N4Visual'
                property 'echoDialogueNpcAdapterClientAcceptance.auto', 'true'
                lazyToken('minecraft_classpath') {
                    configurations.gameTestEmbeddedExternalRuntime.copyRecursive().resolve()
                            .collect { it.absolutePath }
                            .join(File.pathSeparator)
                }
                environment 'MOD_CLASSES', allClientAcceptanceModClasses()
                mods {
                    "echo_dialogue_npc_adapter_client_acceptance" {
                        source sourceSets.clientAcceptanceHarness
                    }
                }
            }
        }
        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            lazyToken('minecraft_classpath') {
                configurations.gameTestEmbeddedExternalRuntime.copyRecursive().resolve()
                        .collect { it.absolutePath }
                        .join(File.pathSeparator)
            }
            environment 'MOD_CLASSES', allGameTestModClasses()
            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }
    }
}

